name: Desplegar en producción

# Cada push a main compila la web y la publica en el VPS (rentahucha.es) con scripts/deploy.sh.
# Secretos del repositorio: DEPLOY_HOST, DEPLOY_SSH_KEY (clave solo para GitHub) y DEPLOY_KNOWN_HOSTS
# (huella del servidor, para no aceptar uno suplantado). También se puede lanzar a mano desde Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue cada vez; si llega otro push, espera a que termine el actual.
concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  # Antes de desplegar: compila, arranca la web con un PostgreSQL vacío y recorre los flujos clave
  # (scripts/smoke-test.mjs). Si algo falla, no se despliega.
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prueba
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: rentahucha
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prueba" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NUXT_DATABASE_URL: postgres://prueba:prueba@localhost:5432/rentahucha
      NUXT_SESSION_PASSWORD: sesion-de-prueba-solo-para-ci-0123456789abcdef
      NUXT_ADMIN_USER: prueba
      NUXT_ADMIN_PASSWORD: clave-de-prueba-solo-para-ci-123
      PORT: '3999'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx nuxt build
      - name: Arrancar la web
        run: |
          nohup node .output/server/index.mjs > servidor.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3999/ && break; sleep 2; done
      - name: Prueba de los flujos clave
        run: node scripts/smoke-test.mjs
        env:
          BASE_URL: http://localhost:3999
          ADMIN_USER: prueba
          ADMIN_PASSWORD: clave-de-prueba-solo-para-ci-123
      - name: Registro del servidor (si falla)
        if: failure()
        run: tail -n 80 servidor.log

  deploy:
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: produccion
      url: https://rentahucha.es
    steps:
      # Si GitHub ejecuta los despliegues fuera de orden, uno antiguo no debe pisar a uno más reciente:
      # solo se despliega si este commit sigue siendo el último de main.
      - name: Comprobar que es el último commit de main
        id: latest
        run: |
          latest=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "${{ github.event_name }}" = push ] && [ "$latest" != "${{ github.sha }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Hay un commit más reciente en main ($latest): no se despliega este."
          fi
      - uses: actions/checkout@v4
        if: steps.latest.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.latest.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      # `npm install` y no `npm ci`: el lockfile se genera con un npm local más antiguo que el de GitHub.
      - run: npm install --no-audit --no-fund
        if: steps.latest.outputs.skip != 'true'
      - name: Preparar acceso SSH
        if: steps.latest.outputs.skip != 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Desplegar
        if: steps.latest.outputs.skip != 'true'
        run: DEPLOY_KEY="$HOME/.ssh/deploy_key" bash scripts/deploy.sh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      - name: Comprobar la web
        if: steps.latest.outputs.skip != 'true'
        run: curl -fsS -o /dev/null -w "rentahucha.es responde %{http_code}\n" https://rentahucha.es/
